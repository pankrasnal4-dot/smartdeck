[platformio]
src_dir = JC8048W550/Arduino/smart_deck
lib_dir = JC8048W550/Arduino/libraries

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = no_ota.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -D CORE_DEBUG_LEVEL=0

[env:jc8048]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = no_ota.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM